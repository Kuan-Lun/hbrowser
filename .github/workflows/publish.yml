name: Publish to PyPI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish.yml
      - hbrowser/**
      - pyproject.toml
      - tests/**

jobs:
  verify-windows-process-ownership:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify Windows shutdown ownership
        shell: pwsh
        run: |
          $output = python -m pytest tests/test_owned_process.py tests/test_browser_factory.py 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $tail = ($output | Select-Object -Last 120) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows shutdown tests failed::$escaped"
          }
          exit $exitCode

  publish:
    needs: verify-windows-process-ownership
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python -m pip install packaging

      - name: Check whether this version is unpublished
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.request

          from packaging.version import Version

          with open("pyproject.toml", "rb") as project_file:
              current = Version(tomllib.load(project_file)["project"]["version"])
          with urllib.request.urlopen(
              "https://pypi.org/pypi/hbrowser/json",
              timeout=30,
          ) as response:
              published = Version(json.load(response)["info"]["version"])

          if current < published:
              raise SystemExit(
                  f"Project version {current} is older than published version {published}"
              )

          print(f"current={current}")
          print(f"published={published}")
          print(f"publish={'true' if current > published else 'false'}")
          PY

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: pip install build && python -m build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
