name: Publish to PyPI

on:
  push:
    branches: [master]
    paths:
      - .gitattributes
      - .github/workflows/publish.yml
      - .gitignore
      - hbrowser/**
      - pyproject.toml
      - scripts/check-process-ownership.sh
      - scripts/install-ci-dependencies.py
      - tests/**

jobs:
  verify-posix-process-ownership:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify POSIX shutdown ownership
        shell: bash
        run: scripts/check-process-ownership.sh

  verify-windows-process-ownership:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify Windows shutdown ownership
        shell: bash
        run: scripts/check-process-ownership.sh

  publish:
    needs:
      - verify-posix-process-ownership
      - verify-windows-process-ownership
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python scripts/install-ci-dependencies.py packaging

      - name: Check whether this version is unpublished
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          import urllib.request

          from packaging.version import Version

          with open("pyproject.toml", "rb") as project_file:
              current = Version(tomllib.load(project_file)["project"]["version"])
          with urllib.request.urlopen(
              "https://pypi.org/pypi/hbrowser/json",
              timeout=30,
          ) as response:
              published = Version(json.load(response)["info"]["version"])

          if current < published:
              raise SystemExit(
                  f"Project version {current} is older than published version {published}"
              )

          print(f"current={current}")
          print(f"published={published}")
          print(f"publish={'true' if current > published else 'false'}")
          PY

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          python scripts/install-ci-dependencies.py build
          python -m build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
