name: Publish to PyPI

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish.yml
      - hbrowser/gallery/browser/factory.py
      - hbrowser/gallery/browser/process.py
      - hbrowser/gallery/browser/tor.py
      - pyproject.toml
      - tests/test_browser_factory.py
      - tests/test_owned_process.py

jobs:
  verify-windows-process-ownership:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify Windows shutdown ownership
        shell: pwsh
        run: |
          $output = python -m pytest tests/test_owned_process.py tests/test_browser_factory.py 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_ }
          if ($exitCode -ne 0) {
            $tail = ($output | Select-Object -Last 120) -join "`n"
            $escaped = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows shutdown tests failed::$escaped"
          }
          exit $exitCode

  publish:
    needs: verify-windows-process-ownership
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python -m pip install packaging

      - name: Check version bump
        id: version
        run: |
          CURRENT=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          PREVIOUS=$(git show HEAD~1:pyproject.toml | python -c "
          import tomllib, sys
          print(tomllib.load(sys.stdin.buffer)['project']['version'])
          ")
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            python -c "
          from packaging.version import Version
          current, previous = Version('$CURRENT'), Version('$PREVIOUS')
          exit(0 if current > previous else 1)
          "
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.bumped == 'true'
        run: pip install build && python -m build

      - name: Publish
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
