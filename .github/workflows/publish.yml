name: Publish to PyPI

on:
  push:
    branches: [master, "fix/**"]
    paths:
      - .gitattributes
      - .github/workflows/publish.yml
      - .gitignore
      - hbrowser/**
      - pyproject.toml
      - scripts/check-process-ownership.sh
      - scripts/pytest-source.py
      - scripts/runtime_test_owner.py
      - scripts/check-publish-version.py
      - scripts/install-ci-dependencies.py
      - scripts/_shared/**
      - tests/**

jobs:
  verify-posix-process-ownership:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify POSIX shutdown ownership
        shell: bash
        run: scripts/check-process-ownership.sh

  verify-windows-process-ownership:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install test environment
        run: python -m pip install --editable ".[dev]"

      - name: Verify Windows shutdown ownership
        shell: bash
        run: scripts/check-process-ownership.sh

  publish:
    if: github.ref == 'refs/heads/master'
    needs:
      - verify-posix-process-ownership
      - verify-windows-process-ownership
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install version checker
        run: python scripts/install-ci-dependencies.py packaging

      - name: Check whether this version is unpublished
        id: version
        run: python scripts/check-publish-version.py >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          python scripts/install-ci-dependencies.py build
          python -m build

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
