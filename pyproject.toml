[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "hbrowser"
version = "0.42.10"
description = "A tool for browsing tasks on e-h/exh-websites."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "asyncio-atexit>=1.0.1,<2",
    "beautifulsoup4>=4.15.0",
    "h2h-galleryinfo-parser>=0.5.3,<0.6",
    "httpx>=0.28.1",
    "websockets>=17.0.1",
    # hbrowser's browser lifecycle has been verified against this exact
    # Zendriver cohort; upgrades require the ownership/lifecycle suite.
    "zendriver==0.16.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "hatchling>=1.32.0",
    "mypy>=2.3.1",
    "packaging>=26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/Kuan-Lun/hbrowser"
Tracker = "https://github.com/Kuan-Lun/hbrowser/issues"

[tool.hatch.build.targets.wheel]
packages = ["hbrowser"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "RUF", "SIM", "UP"]
# Traditional Chinese prose legitimately uses full-width punctuation. SIM
# rewrites are advisory and can obscure lifecycle/safety sequencing whose
# lexical order is audited. B904 is excluded because re-raising the exact
# original exception identity and traceback is a tested lifecycle contract.
ignore = ["B904", "RUF001", "RUF002", "RUF003", "SIM"]

[tool.mypy]
python_version = "3.14"
files = ["hbrowser", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["bs4.*", "h2h_galleryinfo_parser.*", "zendriver.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.h2h.version]
release-paths = ["LICENSE", "hbrowser/**"]
